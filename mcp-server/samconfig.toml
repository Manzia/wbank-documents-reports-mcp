# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "wbank-docs-reports-mcp-prod"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
# `lint` disabled — SAM CLI's bundled cfn-lint crashes with
# "Rule already included: E3056" (DuplicateRuleError). Same workaround as
# manzia-agent-comparison / manzia-trust-portal.
lint = false

[default.deploy.parameters]
# Dedicated artifacts bucket, created out-of-band (see CLAUDE.md -> "AWS deploy
# identity"). NOT `resolve_s3`: `sam deploy` reads this file in CI too, and
# `resolve_s3` conflicts with the `--s3-bucket` that deploy.yml passes.
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
region = "us-east-1"
s3_bucket = "wbank-docs-reports-mcp-artifacts-365677123675"
s3_prefix = "wbank-docs-reports-mcp-prod"

[default.package.parameters]
region = "us-east-1"
s3_bucket = "wbank-docs-reports-mcp-artifacts-365677123675"
s3_prefix = "wbank-docs-reports-mcp-prod"

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
