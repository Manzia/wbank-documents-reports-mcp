  # Design §8.1, rules in evaluation order. Rules 2 and 3 start in COUNT for
  # one week from the MCP-114 deploy, then move to Block (MCP-170). Rule 4
  # needs the 64 KB body inspection limit: WAF can't see past the limit, so
  # a larger body counts as oversize and matches.
  CloudFrontWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: CLOUDFRONT
      Description: IP reputation, per-IP rate tiers and body size for worldbank-mcp.manzia.com
      DefaultAction:
        Allow: {}
      AssociationConfig:
        RequestBody:
          CLOUDFRONT:
            DefaultSizeInspectionLimit: KB_64
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: cloudfront-web-acl
      Rules:
        - Name: ip-reputation
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation
        - Name: ai-platform-rate
          Priority: 1
          Action:
            Count: {}
          Statement:
            RateBasedStatement:
              Limit: 3000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - IPSetReferenceStatement:
                        Arn: !GetAtt AiPlatformIpv4Set.Arn
                    - IPSetReferenceStatement:
                        Arn: !GetAtt AiPlatformIpv6Set.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ai-platform-rate
        - Name: per-ip-rate
          Priority: 2
          Action:
            Count: {}
          Statement:
            RateBasedStatement:
              Limit: 300
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    OrStatement:
                      Statements:
                        - IPSetReferenceStatement:
                            Arn: !GetAtt AiPlatformIpv4Set.Arn
                        - IPSetReferenceStatement:
                            Arn: !GetAtt AiPlatformIpv6Set.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: per-ip-rate
        - Name: body-size
          Priority: 3
          Action:
            Block: {}
          Statement:
            SizeConstraintStatement:
              FieldToMatch:
                Body:
                  OversizeHandling: MATCH
              ComparisonOperator: GT
              Size: 65536
              TextTransformations:
                - Priority: 0
                  Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: body-size

  # Design §3.2 "CloudFront distribution", §6.1. Nothing is cached. Viewer
  # headers go to the gateway except Host, which becomes the gateway's own
  # hostname. CloudFront sets x-origin-verify itself, replacing any value a
  # viewer sends. The 60 s origin response timeout is CloudFront's idle limit
  # between bytes; the server's 15 s SSE pings keep long calls inside it.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: worldbank-mcp.manzia.com to the AgentCore gateway
        Aliases:
          - worldbank-mcp.manzia.com
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2
        IPV6Enabled: true
        WebACLId: !GetAtt CloudFrontWebAcl.Arn
        Origins:
          - Id: gateway
            # GatewayUrl is https://<host>/mcp.
            DomainName: !Select [2, !Split ['/', !GetAtt Gateway.GatewayUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}'
        DefaultCacheBehavior:
          TargetOriginId: gateway
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # AWS managed policies: CachingDisabled, AllViewerExceptHostHeader.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: false

  # Z2FDTNDATAQYW2 is the fixed hosted zone ID for CloudFront alias targets.
  AliasRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: worldbank-mcp.manzia.com
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: worldbank-mcp.manzia.com
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  FunctionUrl:
    Description: MCP server function URL (IAM auth, response streaming); the MCP endpoint is its /mcp path
    Value: !GetAtt McpServerFunctionUrl.FunctionUrl
  GatewayUrl:
    Description: AgentCore gateway MCP endpoint; rejects requests that don't come through CloudFront
    Value: !GetAtt Gateway.GatewayUrl
  GatewayId:
    Description: AgentCore gateway identifier (deploy.yml re-syncs its target `wb`)
    Value: !GetAtt Gateway.GatewayIdentifier
  McpEndpoint:
    Description: Public MCP endpoint (CloudFront); the URL users add as a connector
    Value: https://worldbank-mcp.manzia.com/mcp
