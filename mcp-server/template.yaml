AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Unofficial MCP server for the World Bank Documents & Reports and Projects
  APIs (not affiliated with the World Bank).

# Design: context/design/wbank-mcp-architecture.md. Long prose goes in comments:
# CloudFormation caps Description at 1024 characters (CLAUDE.md, Known Issues).

Globals:
  Function:
    # REQUIRED. The deploy role may only create IAM roles that carry this
    # boundary, so any role created without it fails the deploy with
    # AccessDenied. This covers SAM's implicit function roles. An explicit
    # AWS::IAM::Role (e.g. the AgentCore Gateway service role) must set
    # `PermissionsBoundary` itself. See CLAUDE.md -> "AWS deploy identity".
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
    LoggingConfig:
      LogFormat: JSON

Resources:
  McpServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # Design §3.2 "MCP server function", §6.1. The function URL accepts only
  # SigV4-signed requests (the AgentCore gateway's service role, MCP-113) and
  # streams responses, so SSE progress events and keep-alive pings reach the
  # client while a tool runs.
  McpServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: server/
      Handler: mcp.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 300
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref McpServerLogGroup
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
      Policies:
        # Haiku 5.5 through the US cross-region inference profile only (design §7).
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5
                - !Sub arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-5-5
                - !Sub arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-5-5
                - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-5-5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2023
        Sourcemap: true
        EntryPoints:
          - src/handlers/mcp.ts

  # Design §3.2 "Gateway service role". The gateway signs its calls to the
  # function URL with this role (SigV4, service `lambda`). IAM-auth function
  # URLs need both InvokeFunctionUrl and InvokeFunction. The SourceArn pattern
  # matches the gateway's ID, which is its name plus a 10-character suffix.
  GatewayServiceRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/${AWS::StackName}-*
      Policies:
        - PolicyName: invoke-mcp-server-function-url
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource: !GetAtt McpServerFunction.Arn
                Condition:
                  StringEquals:
                    lambda:FunctionUrlAuthType: AWS_IAM
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt McpServerFunction.Arn
                Condition:
                  Bool:
                    lambda:InvokedViaFunctionUrl: 'true'

  # Design §3.2 "AgentCore Gateway", §6.1. No inbound auth: the regional WAF
  # below admits only requests carrying the origin secret, which CloudFront
  # adds (MCP-114). Retained so the gateway URL that CloudFront points at
  # survives a stack deletion or a replacing change. The name must stay
  # lowercase: the service role's SourceArn condition matches it.
  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref AWS::StackName
      Description: Unofficial MCP server for the World Bank Documents & Reports and Projects APIs
      ProtocolType: MCP
      AuthorizerType: NONE
      RoleArn: !GetAtt GatewayServiceRole.Arn
      ProtocolConfiguration:
        Mcp:
          SupportedVersions:
            - '2025-03-26'
            - '2025-06-18'
            - '2025-11-25'
            - '2026-07-28'
          StreamingConfiguration:
            EnableResponseStreaming: true
      WafConfiguration:
        FailureMode: FAIL_CLOSE

  # Design §3.2 "Origin secret". Generated by Secrets Manager; its value never
  # appears in the repo, the template or any output. CloudFront sends it in
  # the `x-origin-verify` header (MCP-114) and the regional WAF requires it.
  # Both read it by dynamic reference. Rotate by hand, then redeploy.
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Origin header value that CloudFront adds and the gateway's WAF requires
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false

  # Design §8.2. Rule 1 blocks any request without the origin secret, so the
  # gateway's own hostname can't be used to get round CloudFront's per-IP
  # rules. Blocked MCP requests get JSON-RPC error -32002.
  GatewayWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      Description: Origin lock and IP reputation for the AgentCore gateway
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: gateway-web-acl
      Rules:
        - Name: origin-lock
          Priority: 0
          Action:
            Block: {}
          Statement:
            NotStatement:
              Statement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader:
                      Name: x-origin-verify
                  PositionalConstraint: EXACTLY
                  SearchString: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}'
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: origin-lock
        - Name: ip-reputation
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation

  GatewayWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !GetAtt Gateway.GatewayArn
      WebACLArn: !GetAtt GatewayWebAcl.Arn

  # Design §3.2 "Gateway target `wb`". Clients see its tools as `wb___<tool>`.
  # The gateway caches the tool list it syncs from the server, so deploy.yml
  # re-syncs this target after every deploy. Created only once the WAF is
  # attached, so the gateway never serves tools without the origin lock.
  GatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    DependsOn: GatewayWebAclAssociation
    Properties:
      GatewayIdentifier: !GetAtt Gateway.GatewayIdentifier
      Name: wb
      Description: World Bank Documents & Reports and Projects tools (MCP server on Lambda)
      TargetConfiguration:
        Mcp:
          McpServer:
            # FunctionUrl ends in "/".
            Endpoint: !Sub ${McpServerFunctionUrl.FunctionUrl}mcp
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
          CredentialProvider:
            IamCredentialProvider:
              Service: lambda

Outputs:
  FunctionUrl:
    Description: MCP server function URL (IAM auth, response streaming); the MCP endpoint is its /mcp path
    Value: !GetAtt McpServerFunctionUrl.FunctionUrl
  GatewayUrl:
    Description: AgentCore gateway MCP endpoint; rejects requests that don't come through CloudFront
    Value: !GetAtt Gateway.GatewayUrl
  GatewayId:
    Description: AgentCore gateway identifier (deploy.yml re-syncs its target `wb`)
    Value: !GetAtt Gateway.GatewayIdentifier
