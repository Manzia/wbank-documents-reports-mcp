AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  mcp-server

  Sample SAM Template for mcp-server

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
    # REQUIRED. The deploy role may only create IAM roles that carry this
    # boundary, so any role created without it fails the deploy with
    # AccessDenied. This covers SAM's implicit function roles. An explicit
    # AWS::IAM::Role (e.g. the AgentCore Gateway service role) must set
    # `PermissionsBoundary` itself. See CLAUDE.md -> "AWS deploy identity".
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess

    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
Resources:
  # Delegated from manzia.com (another AWS account): its 4 NS records are
  # added there by hand (MCP-111). Design §3.2. Retained so the delegation
  # never points at a deleted zone; remove those NS records before deleting it.
  HostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: worldbank-mcp.manzia.com
      HostedZoneConfig:
        Comment: Delegated from manzia.com for the World Bank MCP server

  HelloWorldFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: hello-world/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
      - arm64
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /hello
            Method: get
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts

Outputs:
  HostedZoneNameServers:
    Description: Name servers of the worldbank-mcp.manzia.com zone, for the NS
      records in manzia.com
    Value: !Join [",", !GetAtt HostedZone.NameServers]
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  HelloWorldApi:
    Description: API Gateway endpoint URL for Prod stage for Hello World 
      function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/hello/"
  HelloWorldFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: Implicit IAM Role created for Hello World function
    Value: !GetAtt HelloWorldFunctionRole.Arn
