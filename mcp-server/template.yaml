AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Unofficial MCP server for the World Bank Documents & Reports and Projects
  APIs (not affiliated with the World Bank).

# Design: context/design/wbank-mcp-architecture.md. Long prose goes in comments:
# CloudFormation caps Description at 1024 characters (CLAUDE.md, Known Issues).

Globals:
  Function:
    # REQUIRED. The deploy role may only create IAM roles that carry this
    # boundary, so any role created without it fails the deploy with
    # AccessDenied. This covers SAM's implicit function roles. An explicit
    # AWS::IAM::Role (e.g. the AgentCore Gateway service role) must set
    # `PermissionsBoundary` itself. See CLAUDE.md -> "AWS deploy identity".
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
    LoggingConfig:
      LogFormat: JSON

Resources:
  McpServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # Design §3.2 "MCP server function", §6.1. The function URL accepts only
  # SigV4-signed requests (the AgentCore gateway's service role, MCP-113) and
  # streams responses, so SSE progress events and keep-alive pings reach the
  # client while a tool runs.
  McpServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: server/
      Handler: mcp.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 300
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref McpServerLogGroup
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
      Policies:
        # Haiku 5.5 through the US cross-region inference profile only (design §7).
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5
                - !Sub arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-5-5
                - !Sub arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-5-5
                - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-5-5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2023
        Sourcemap: true
        EntryPoints:
          - src/handlers/mcp.ts

Outputs:
  FunctionUrl:
    Description: MCP server function URL (IAM auth, response streaming); the MCP endpoint is its /mcp path
    Value: !GetAtt McpServerFunctionUrl.FunctionUrl
