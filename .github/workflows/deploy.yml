name: Deploy Pipeline

# Single-stack, single-env CD. Triggered when CI Pipeline succeeds on a
# push to `main` (i.e. a merged PR), or manually via workflow_dispatch.
#
# Deploy step pattern (same as manzia-agent-comparison):
#   rm -rf .aws-sam/ → sam build --no-cached → sam deploy with explicit
#   --stack-name, --capabilities, --force-upload, --no-confirm-changeset,
#   --no-fail-on-empty-changeset.

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    # Only CI runs on `main` start this workflow. Without the filter every
    # feature-branch and PR CI run started a no-op deploy run (see below).
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  AWS_REGION: us-east-1
  STACK_NAME: wbank-docs-reports-mcp-prod
  ARTIFACTS_BUCKET: wbank-docs-reports-mcp-artifacts-365677123675

jobs:
  # ====================================================================
  # Decide whether this run deploys. workflow_dispatch always does; a
  # workflow_run does only if the triggering commit touched the stack.
  # ====================================================================
  setup:
    name: Resolve changes
    # `event == 'push'` matters because this repo is public: a fork's PR
    # from a branch it named `main` produces a CI run whose head_branch is
    # also 'main'. Only a push to this repo's main may trigger a deploy.
    if: |
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      mcp-server: ${{ steps.diff.outputs.mcp-server }}
    steps:
      # `main` is a literal, not `workflow_run.head_branch`: interpolating a
      # branch name into `ref:` is a ref-injection foothold.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: main

      - id: diff
        name: Detect changes in triggering commit
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "mcp-server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          echo "Changed:"
          echo "${CHANGED}"

          # deploy.yml counts as a stack change: it carries the deploy
          # flags (and any future --parameter-overrides), so editing it
          # changes what a deploy produces without touching mcp-server/.
          # Redeploying is cheap — an unchanged stack is an empty changeset.
          if echo "${CHANGED}" | grep -qE '^(mcp-server/|\.github/workflows/deploy\.yml$)'; then
            echo "mcp-server=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-server=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy MCP server (prod)
    needs: setup
    if: needs.setup.outputs.mcp-server == 'true'
    runs-on: ubuntu-latest
    # `production` requires a manual approval and only admits `main`.
    # It also shapes the OIDC token: the role's trust policy accepts only
    # sub `...:environment:production` AND ref `refs/heads/main`.
    environment:
      name: production
    # Never run two deploys at once: a second `sam deploy` against a stack in
    # UPDATE_IN_PROGRESS fails. Queue instead of cancelling a half-done update.
    # The group is on this job, not the workflow, so runs that skip the
    # deploy never join it. A group holds one running and one pending entry,
    # and a newer entry cancels the pending one, so a skipped run could
    # otherwise cancel a real deploy queued behind another. A newer real
    # deploy replacing a queued one loses nothing: both deploy `main`.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # mint the GitHub OIDC token for AssumeRoleWithWebIdentity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        # OIDC — no long-lived AWS keys exist in GitHub. The role ARN is a
        # `production` environment variable (not secret).
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate template
        run: |
          cd mcp-server
          sam validate

      - name: Clean build artifacts
        run: |
          cd mcp-server
          rm -rf .aws-sam/

      - name: Build application
        run: |
          cd mcp-server
          sam build --no-cached

      - name: Deploy
        env:
          # A `production` variable, not a secret, so mask it before any
          # output: the address must not appear in the run log (MCP-140).
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "${ALERT_EMAIL}" ]]; then
            echo "::error::The production environment variable ALERT_EMAIL is not set"
            exit 1
          fi
          echo "::add-mask::${ALERT_EMAIL}"
          cd mcp-server
          # Override only parameters the template declares: passing one it
          # doesn't declare fails the deploy. AlertEmail is NoEcho.
          # HostedZoneId keeps its default.
          #
          # Dedicated artifacts bucket (created out-of-band, us-east-1), not
          # --resolve-s3: that would make the pipeline create and own a
          # second stack + bucket. It MUST stay in the deploy region — a
          # bucket elsewhere fails at Lambda create with "S3 Error Code:
          # TemporaryRedirect".
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --s3-bucket ${{ env.ARTIFACTS_BUCKET }} \
            --s3-prefix ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides "AlertEmail=${ALERT_EMAIL}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --force-upload

      # The gateway caches the tool list it synced from the MCP server
      # (design §6.1, plan G4), and a new function version doesn't refresh
      # it. Re-sync target `wb` on every deploy and fail the job unless the
      # sync finishes READY with a sync time after this step started. Safe to
      # run repeatedly. Prints no secret: the origin secret lives only in
      # Secrets Manager and the WAF, which this step doesn't read.
      - name: Re-sync gateway target
        run: |
          set -euo pipefail
          GATEWAY_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='GatewayId'].OutputValue | [0]" \
            --output text)
          TARGET_ID=$(aws bedrock-agentcore-control list-gateway-targets \
            --gateway-identifier "${GATEWAY_ID}" \
            --query "items[?name=='wb'].targetId | [0]" \
            --output text)
          if [[ -z "${GATEWAY_ID}" || "${GATEWAY_ID}" == "None" || -z "${TARGET_ID}" || "${TARGET_ID}" == "None" ]]; then
            echo "::error::Gateway or target 'wb' not found (gateway '${GATEWAY_ID}', target '${TARGET_ID}')"
            exit 1
          fi
          echo "Gateway ${GATEWAY_ID}, target wb (${TARGET_ID})"

          START=$(date -u +%s)
          aws bedrock-agentcore-control synchronize-gateway-targets \
            --gateway-identifier "${GATEWAY_ID}" \
            --target-id-list "${TARGET_ID}" \
            --query 'targets[].{target:name,status:status}' \
            --output table

          for _ in $(seq 1 60); do
            sleep 10
            read -r STATUS SYNCED < <(aws bedrock-agentcore-control get-gateway-target \
              --gateway-identifier "${GATEWAY_ID}" \
              --target-id "${TARGET_ID}" \
              --query '[status, lastSynchronizedAt]' \
              --output text)
            echo "status ${STATUS}, last synchronized ${SYNCED}"
            case "${STATUS}" in
              READY)
                # Clock slack: the service stamps the sync, the runner stamps START.
                if [[ "${SYNCED}" != "None" ]] && (( $(date -u -d "${SYNCED}" +%s) >= START - 30 )); then
                  echo "Target wb re-synced."
                  exit 0
                fi
                ;;
              SYNCHRONIZING|UPDATING|CREATING) ;;
              *)
                aws bedrock-agentcore-control get-gateway-target \
                  --gateway-identifier "${GATEWAY_ID}" \
                  --target-id "${TARGET_ID}" \
                  --query 'statusReasons' --output text || true
                echo "::error::Re-sync of target wb failed with status ${STATUS}"
                exit 1
                ;;
            esac
          done
          echo "::error::Re-sync of target wb did not finish within 10 minutes"
          exit 1

      # Design §7.2: a new or changed stack always gets a current vocabulary
      # snapshot. Invokes the refresh function synchronously (it runs for up
      # to 15 minutes) and fails the job if it fails; a failed refresh writes
      # nothing, so the previous snapshot stays. One attempt only, so a read
      # timeout can't start a second refresh.
      - name: Refresh vocabulary snapshot
        env:
          AWS_MAX_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          FUNCTION=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='RefreshVocabularyFunction'].OutputValue | [0]" \
            --output text)
          if [[ -z "${FUNCTION}" || "${FUNCTION}" == "None" ]]; then
            echo "::error::Refresh function not found in the stack outputs"
            exit 1
          fi
          echo "Invoking ${FUNCTION}"
          OUT="${RUNNER_TEMP}/refresh-vocabulary.json"
          FUNCTION_ERROR=$(aws lambda invoke \
            --function-name "${FUNCTION}" \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            --cli-read-timeout 960 \
            --query 'FunctionError' \
            --output text \
            "${OUT}")
          cat "${OUT}"; echo
          if [[ "${FUNCTION_ERROR}" != "None" ]]; then
            echo "::error::Vocabulary refresh failed (${FUNCTION_ERROR}); the previous snapshot stays"
            exit 1
          fi
          echo "Vocabulary snapshot refreshed."

      - name: Stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[].{Key:OutputKey,Value:OutputValue}' \
            --output table
