name: CI Pipeline

# Path-gated CI for the World Bank Documents & Reports MCP server
# (single SAM project, single env). The `mcp-server` job runs only when
# something under `mcp-server/` changed, or when CI itself changed.
#
# Branches: `main` + `feature/**` only — there is no develop/staging.

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      mcp-server: ${{ steps.diff.outputs.mcp-server }}
      ci-config: ${{ steps.diff.outputs.ci-config }}
      dispatch: ${{ steps.diff.outputs.dispatch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Compute changed paths
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # The first push of a branch has no `before`, and after a force push
          # `before` is on no branch, so this checkout doesn't have it (git
          # diff failed with "bad object" and every job was skipped). Compare
          # with where the branch left main instead; on main, the last commit.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main "${HEAD}")
            if [[ "${BASE}" == "$(git rev-parse "${HEAD}")" ]]; then
              BASE="${HEAD}~1"
            fi
            echo "Comparing with ${BASE} (no usable before commit)"
          fi

          # No `|| true`: a failed diff must fail the job, not read as "nothing changed".
          CHANGED=$(git diff --name-only "${BASE}" "${HEAD}")
          echo "Changed files:"
          echo "${CHANGED}"

          if echo "${CHANGED}" | grep -q '^mcp-server/'; then
            echo "mcp-server=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-server=false" >> "$GITHUB_OUTPUT"
          fi

          # The local dispatcher's tests (scripts/dispatch/) also read the task file.
          if echo "${CHANGED}" | grep -qE '^(scripts/dispatch/|context/tasks/wbank-mcp-tasks\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
          fi

          # Re-run the pipeline when CI itself or its helper scripts change.
          if echo "${CHANGED}" | grep -qE '^(\.github/|scripts/)'; then
            echo "ci-config=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci-config=false" >> "$GITHUB_OUTPUT"
          fi

  mcp-server:
    name: MCP server (SAM)
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp-server == 'true' || needs.detect-changes.outputs.ci-config == 'true'
    uses: ./.github/workflows/_ci-sam.yml
    with:
      project-path: mcp-server
      package-path: mcp-server/server
      project-name: mcp-server
      node-version: '24.x'
      coverage-threshold: 80

  # Local dispatcher (context/tasks/wbank-mcp-implementation-plan.md §6).
  # Build tooling only: never deployed.
  dispatch:
    name: Dispatcher tests
    needs: detect-changes
    if: needs.detect-changes.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/dispatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: scripts/dispatch/package-lock.json

      - run: npm ci
      - run: npm test

  # The ONE check `main`'s branch protection requires. It always reports,
  # so a path-gated skip (docs-only change) still yields a green check;
  # requiring the nested `MCP server (SAM) / *` checks instead would block
  # such PRs forever, because a skipped reusable workflow never reports them.
  ci-result:
    name: CI result
    needs: [detect-changes, mcp-server, dispatch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [[ "${r}" == "failure" || "${r}" == "cancelled" ]]; then
              echo "::error::CI failed (${RESULTS})"
              exit 1
            fi
          done
